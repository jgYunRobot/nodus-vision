            "control.set_servo_state": "#/components/schemas/SetServoStateRequest",
            "control.reset_fault": "#/components/schemas/ResetFaultRequest",
            "control.reset_origin": "#/components/schemas/ResetOriginRequest",
            "control.set_brake_state": "#/components/schemas/SetBrakeStateRequest",
            "control.register_frame": "#/components/schemas/RegisterFrameRequest"
          }
        }
      },
      "OperationDelivery": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "outcome",
          "connection_generation"
        ],
        "properties": {
          "outcome": {
            "type": "string",
            "enum": [
              "written_unconfirmed",
              "response_received",
              "rejected_local",
              "timed_out",
              "disconnected",
              "protocol_error",
              "queue_full"
            ]
          },
          "connection_generation": {
            "$ref": "#/components/schemas/NonNegativeInt64"
          }
        }
      },
      "ControlOutcome": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "code",
          "message"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "not_reported",
              "accepted",
              "rejected",
              "completed"
            ]
          },
          "code": {
            "type": [
              "string",
              "null"
            ]
          },
          "message": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "OperationError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "$ref": "#/components/schemas/Identifier"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "JointStateResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "pos",
          "vel",
          "acc",
          "torque"
        ],
        "properties": {
          "pos": {
            "$ref": "#/components/schemas/Vector500"
          },
          "vel": {
            "$ref": "#/components/schemas/Vector500"
          },
          "acc": {
            "$ref": "#/components/schemas/Vector500"
          },
          "torque": {
            "$ref": "#/components/schemas/Vector500"
          }
        }
      },
      "RobotInterfaceResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "robot_type",
          "connected",
          "dof",
          "servo_activated",
          "brake_released",
          "brake_state_source",
          "motion_gate_state",
          "motion_gate_reason",
          "expected_wkc",
          "last_wkc",
          "last_error"
        ],
        "properties": {
          "schema_version": {
            "$ref": "#/components/schemas/NonNegativeInt64"
          },
          "robot_type": {
            "type": "string"
          },
          "connected": {
            "type": "boolean"
          },
          "dof": {
            "$ref": "#/components/schemas/NonNegativeInt64"
          },
          "servo_activated": {
            "type": "boolean"
          },
          "brake_released": {
            "type": "boolean"
          },
          "brake_state_source": {
            "type": "string"
          },
          "motion_gate_state": {
            "type": "string"
          },
          "motion_gate_reason": {
            "type": "string"
          },
          "expected_wkc": {
            "$ref": "#/components/schemas/NonNegativeInt64"
          },
          "last_wkc": {
            "$ref": "#/components/schemas/NonNegativeInt64"
          },
          "last_error": {
            "type": "string"
          }
        }
      },
      "RobotFrameResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "x",
          "y",
          "z",
          "r1",
          "r2",
          "r3",
          "euler_type"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/NonNegativeInt64"
          },
          "name": {
            "type": "string"
          },
          "x": {
            "$ref": "#/components/schemas/FiniteNumber"
          },
          "y": {
            "$ref": "#/components/schemas/FiniteNumber"
          },
          "z": {
            "$ref": "#/components/schemas/FiniteNumber"
          },
          "r1": {
            "$ref": "#/components/schemas/FiniteNumber"
          },
          "r2": {
            "$ref": "#/components/schemas/FiniteNumber"
          },
          "r3": {
            "$ref": "#/components/schemas/FiniteNumber"
          },
          "euler_type": {
            "type": "string",
            "enum": [
              "XYZ",
              "XZY",
              "YXZ",
              "YZX",
              "ZXY",
              "ZYX",
              "ZXZ",
              "ZYZ"
            ]
          }
        }
      },
      "RobotStatusOperationResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "timestamp_ns",
          "real",
          "desired",
          "interface",
          "frames"
        ],
        "properties": {
          "timestamp_ns": {
            "$ref": "#/components/schemas/NonNegativeInt64"
          },
          "real": {
            "$ref": "#/components/schemas/JointStateResult"
          },
          "desired": {
            "$ref": "#/components/schemas/JointStateResult"
          },
          "interface": {
            "$ref": "#/components/schemas/RobotInterfaceResult"
          },
          "frames": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RobotFrameResult"
            }
          }
        }
      },
      "RegisterFrameOperationResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "timestamp_ns",
          "registered"
        ],
        "properties": {
          "timestamp_ns": {
            "$ref": "#/components/schemas/NonNegativeInt64"
          },
          "registered": {
            "type": "boolean"
          }
        }
      },
      "OperationResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "request_id",
          "operation",
          "control_id",
          "pilot_disposition",
          "delivery",
          "control_outcome",
          "result",
          "error"
        ],
        "properties": {
          "schema_version": {
            "const": 1
          },
          "request_id": {
            "$ref": "#/components/schemas/Identifier"
          },
          "operation": {
            "type": "string",
            "enum": [
              "control.move_joint_online",
              "control.move_joint_offline",
              "control.move_task_online",
              "control.calculate_forward_kinematics",
              "control.get_robot_status",
              "control.set_servo_state",
              "control.reset_fault",
              "control.reset_origin",
              "control.set_brake_state",
              "control.register_frame"
            ]
          },
          "control_id": {
            "$ref": "#/components/schemas/Identifier"
          },
          "pilot_disposition": {
            "type": "string",
            "enum": [
              "rejected",
              "forwarded",
              "unknown"
            ]
          },
          "delivery": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/OperationDelivery"
              },
              {
                "type": "null"
              }
            ]
          },
          "control_outcome": {
            "$ref": "#/components/schemas/ControlOutcome"
          },
          "result": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/RobotStatusOperationResult"
              },
              {
                "$ref": "#/components/schemas/RegisterFrameOperationResult"
              },
              {
                "type": "null"
              }
            ]
          },
          "error": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/OperationError"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "SampleStreamsResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["server_instance_id", "streams"],
        "properties": {
          "server_instance_id": {"$ref": "#/components/schemas/Identifier"},
          "streams": {
            "type": "array",
            "items": {"$ref": "#/components/schemas/SampleStreamDescriptor"}
          }
        }
      },
      "SampleStreamDescriptor": {
        "type": "object",
        "additionalProperties": false,
        "required": ["stream_id", "owner", "control_id", "stream_kind", "schema_id", "schema_version", "source_clock_domains", "configured_production_hz", "retention_capacity", "recording_grade"],
        "properties": {
          "stream_id": {"type": "string", "minLength": 1, "maxLength": 256},
          "owner": {"const": "pilot"},
          "control_id": {"$ref": "#/components/schemas/Identifier"},
          "stream_kind": {"type": "string", "enum": ["robot_status", "control_operation"]},
          "schema_id": {"type": "string", "minLength": 1, "maxLength": 256},
          "schema_version": {"const": 1},
          "source_clock_domains": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1, "maxLength": 128}},
          "configured_production_hz": {"type": ["number", "null"], "exclusiveMinimum": 0},
          "retention_capacity": {"type": "integer", "minimum": 1},
          "recording_grade": {"const": true}
        }
      },
      "SampleEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schema_version", "server_instance_id", "owner", "stream_id", "stream_kind", "schema_id", "control_id", "stream_generation", "sequence", "source_clock_domain", "source_timestamp_ns", "pilot_receive_monotonic_ns", "pilot_publish_monotonic_ns", "payload"],
        "properties": {
          "schema_version": {"const": 1},
          "server_instance_id": {"$ref": "#/components/schemas/Identifier"},
          "owner": {"const": "pilot"},
          "stream_id": {"type": "string", "minLength": 1, "maxLength": 256},
          "stream_kind": {"type": "string", "enum": ["robot_status", "control_operation"]},
          "schema_id": {"type": "string", "minLength": 1, "maxLength": 256},
          "control_id": {"$ref": "#/components/schemas/Identifier"},
          "stream_generation": {"type": "integer", "minimum": 0},
          "sequence": {"type": "integer", "minimum": 1},
          "source_clock_domain": {"type": "string", "minLength": 1, "maxLength": 128},
          "source_timestamp_ns": {"type": "integer", "minimum": 0},
          "pilot_receive_monotonic_ns": {"type": "integer", "minimum": 0},
          "pilot_publish_monotonic_ns": {"type": "integer", "minimum": 0},
          "payload": {"type": "object"}
        }
      }
    }
  }
}
