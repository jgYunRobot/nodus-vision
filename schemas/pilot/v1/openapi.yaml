{
  "openapi": "3.1.0",
  "info": {
    "title": "Nodus Pilot Public API",
    "version": "1.0.2"
  },
  "paths": {
    "/api/v1/health": {
      "get": {
        "summary": "Read Pilot process health and readiness",
        "responses": {
          "200": {
            "description": "Current Pilot health",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/snapshot": {
      "get": {
        "summary": "Read the authoritative redacted Pilot snapshot",
        "responses": {
          "200": {
            "description": "Current Pilot snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PilotSnapshot"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/components": {
      "get": {
        "summary": "List live external components without session tokens",
        "responses": {
          "200": {
            "description": "Current live component projections",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ComponentsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/controls/{control_id}/status": {
      "get": {
        "summary": "Read the latest Pilot-owned Control status projection",
        "parameters": [
          {
            "$ref": "#/components/parameters/ControlId"
          }
        ],
        "responses": {
          "200": {
            "description": "Latest Control status and freshness",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ControlStatusResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/api/v1/controls/{control_id}/status/samples": {
      "get": {
        "summary": "Read retained Control status samples after a cursor",
        "parameters": [
          {
            "$ref": "#/components/parameters/ControlId"
          },
          {
            "$ref": "#/components/parameters/AfterSequence"
          },
          {
            "$ref": "#/components/parameters/ConnectionGeneration"
          }
        ],
        "responses": {
          "200": {
            "description": "Bounded status sample batch with gap evidence",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ControlStatusSampleBatchResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/api/v1/controls/{control_id}/status/stream": {
      "get": {
        "summary": "Stream sampled Control status for UI and observers",
        "parameters": [
          {
            "$ref": "#/components/parameters/ControlId"
          }
        ],
        "responses": {
          "200": {
            "description": "SSE stream whose robot_status data is ControlStatusResponse JSON",
            "content": {
              "text/event-stream": {
                "schema": {
                  "$ref": "#/components/schemas/SseStream"
                },
                "x-sse-event-payloads": {
                  "robot_status": {
                    "$ref": "#/components/schemas/ControlStatusResponse"
                  }
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      }
    },
    "/api/v1/pilot/streams": {
      "get": {
        "summary": "List finite Pilot-owned sample stream descriptors",
        "parameters": [
          {
            "$ref": "#/components/parameters/SampleControlId"
          },
          {
            "$ref": "#/components/parameters/SampleStreamKind"
          },
          {
            "$ref": "#/components/parameters/SampleSchemaId"
          }
        ],
        "responses": {
          "200": {
            "description": "Pilot stream descriptors",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SampleStreamsResponse"
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"}
        }
      }
    },
    "/api/v1/pilot/streams/subscription": {
      "get": {
        "summary": "Subscribe to selected Pilot sample streams",
        "responses": {
          "200": {"description": "Multiplexed latest or replay SSE", "content": {"text/event-stream": {"schema": {"$ref": "#/components/schemas/SseStream"}}}},
          "400": {"$ref": "#/components/responses/BadRequest"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        }
      }
    },
    "/api/v1/pilot/streams/{stream_id}/samples": {
      "get": {
        "summary": "Read a bounded retained Pilot sample batch",
        "parameters": [
          {
            "name": "stream_id",
            "in": "path",
            "required": true,
            "schema": {"type": "string", "minLength": 1, "maxLength": 256}
          }
        ],
        "responses": {
          "200": {"description": "Sample batch", "content": {"application/json": {"schema": {"type": "object"}}}},
          "400": {"$ref": "#/components/responses/BadRequest"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "409": {"$ref": "#/components/responses/Conflict"}
        }
      }
    },
    "/api/v1/events/stream": {
      "get": {
        "summary": "Stream bounded Pilot operational events after an optional cursor",
        "parameters": [
          {
            "$ref": "#/components/parameters/LastEventIdHeader"
          },
          {
            "$ref": "#/components/parameters/LastEventIdQuery"
          }
        ],
        "responses": {
          "200": {
            "description": "SSE stream of PilotEventEnvelope data and explicit gap data",
            "content": {
              "text/event-stream": {
                "schema": {
                  "$ref": "#/components/schemas/SseStream"
                },
                "x-sse-event-payloads": {
                  "default": {
                    "$ref": "#/components/schemas/PilotEventEnvelope"
                  },
                  "gap": {
                    "$ref": "#/components/schemas/EventGapPayload"
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      }
    },
    "/api/v1/components/register": {
      "post": {
        "summary": "Register or replace one generic component session",
        "description": "Registers the live component session used by lifecycle routes and, under the current role-neutral pass_through policy, by POST /api/v1/operations. A UI command producer registers with component_type ui and uses only the opaque session_id returned by this response; component_type and capabilities are descriptive and do not grant authority.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ComponentRegistrationRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Server-owned opaque session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ComponentRegistrationResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      }
    },
    "/api/v1/components/{session_id}/heartbeat": {
      "post": {
        "summary": "Renew a component lease",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/HeartbeatRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Lifecycle update accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LifecycleAcceptedResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          }
        }
      }
    },
    "/api/v1/components/{session_id}/state": {
      "post": {
        "summary": "Replace component diagnostic state and renew its lease",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ComponentStateUpdate"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Lifecycle update accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LifecycleAcceptedResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          }
        }
      }
    },
    "/api/v1/components/{session_id}/disconnect": {
      "post": {
        "summary": "Disconnect one component session",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DisconnectRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Lifecycle update accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LifecycleAcceptedResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          }
        }
      }
    },
    "/api/v1/endpoints": {
      "get": {
        "summary": "List currently advertised direct provider endpoints",
        "parameters": [
          {
            "$ref": "#/components/parameters/EndpointComponentId"
          },
          {
            "$ref": "#/components/parameters/EndpointDescriptorId"
          },
          {
            "$ref": "#/components/parameters/EndpointKind"
          },
          {
            "$ref": "#/components/parameters/EndpointCapability"
          },
          {
            "$ref": "#/components/parameters/EndpointContractVersion"
          },
          {
            "$ref": "#/components/parameters/EndpointSchemaId"
          },
          {
            "$ref": "#/components/parameters/EndpointLimit"
          },
          {
            "$ref": "#/components/parameters/EndpointCursor"
          }
        ],
        "responses": {
          "200": {
            "description": "Bounded deterministic endpoint directory page",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EndpointDirectoryResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          }
        }
      }
    },
    "/api/v1/components/{session_id}/endpoint-catalog": {
      "put": {
        "summary": "Atomically replace one live component endpoint catalog",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EndpointCatalogPublicationRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Catalog accepted or idempotently replayed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EndpointCatalogAcceptedResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      }
    },
    "/api/v1/operations": {
      "post": {
        "summary": "Admit one external Control operation",
        "description": "Accepts an operation from any live generic component session while source_policy is pass_through, including a component_type ui Portal session. session_id comes from ComponentRegistrationResponse. The command producer owns a separate operation (generation, sequence) cursor; it is not the lifecycle heartbeat/state sequence. On session replacement, expiry, or Pilot restart, the producer must stop active holds, re-register, reset the operation cursor for the new session, and must not replay a previous mutating request.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OperationRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Correlated Control response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OperationResult"
                }
              }
            }
          },
          "202": {
            "description": "Control frame written without execution acknowledgement",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OperationResult"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "description": "Rejected result or admission conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OperationResultOrErrorResponse"
                }
              }
            }
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          },
          "500": {
            "description": "Unexpected Pilot operation failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OperationResult"
                }
              }
            }
          },
          "503": {
            "description": "Unavailable result or bounded HTTP admission capacity",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OperationResultOrErrorResponse"
                }
              }
            }
          },
          "504": {
            "description": "Correlated Control response exceeded its deadline",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OperationResult"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "SessionId": {
        "name": "session_id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Identifier"
        }
      },
      "ControlId": {
        "name": "control_id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Identifier"
        }
      },
      "SampleControlId": {
        "name": "control_id",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/Identifier"
        }
      },
      "SampleStreamKind": {
        "name": "stream_kind",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": ["robot_status", "control_operation"]
        }
      },
      "SampleSchemaId": {
        "name": "schema_id",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256,
          "x-max-utf8-bytes": 256
        }
      },
      "AfterSequence": {
        "name": "after_sequence",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/NonNegativeInt64",
          "default": 0
        }
      },
      "ConnectionGeneration": {
        "name": "connection_generation",
        "in": "query",
        "required": false,
        "description": "Required when after_sequence is non-zero.",
        "schema": {
          "$ref": "#/components/schemas/NonNegativeInt64"
        }
      },
      "LastEventIdHeader": {
        "name": "Last-Event-ID",
        "in": "header",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/NonNegativeInt64"
        }
      },
      "LastEventIdQuery": {
        "name": "last_event_id",
        "in": "query",
        "required": false,
        "description": "Overrides Last-Event-ID when both cursors are supplied.",
        "schema": {
          "$ref": "#/components/schemas/NonNegativeInt64"
        }
      },
      "EndpointComponentId": {
        "name": "component_id",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/Identifier"
        }
      },
      "EndpointDescriptorId": {
        "name": "descriptor_id",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/Identifier"
        }
      },
      "EndpointKind": {
        "name": "kind",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": ["service", "stream"]
        }
      },
      "EndpointCapability": {
        "name": "capability",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/Identifier"
        }
      },
      "EndpointContractVersion": {
        "name": "contract_version",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 2147483647
        }
      },
      "EndpointSchemaId": {
        "name": "schema_id",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256,
          "x-max-utf8-bytes": 256
        }
      },
      "EndpointLimit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 128,
          "default": 64
        }
      },
      "EndpointCursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2048,
          "x-max-utf8-bytes": 2048
        }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid request",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "NotFound": {
        "description": "Requested resource is unavailable",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Conflict": {
        "description": "Request conflicts with current session or operation state",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "PayloadTooLarge": {
        "description": "Request body exceeds the configured bound",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "UnsupportedMediaType": {
        "description": "Request is not application/json",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ServiceUnavailable": {
        "description": "Bounded service capacity or dependency is unavailable",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "Identifier": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "x-max-utf8-bytes": 128
      },
      "DiagnosticString": {
        "type": "string",
        "maxLength": 1024,
        "x-max-utf8-bytes": 1024
      },
      "ComponentType": {
        "type": "string",
        "enum": [
          "input_source",
          "camera",
          "policy",
          "ui",
          "observer",
          "service_provider"
        ]
      },
      "EndpointProtocol": {
        "type": "string",
        "enum": [
          "http",
          "https"
        ]
      },
      "EndpointMediaType": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "x-max-utf8-bytes": 128
      },
      "EndpointSchemaId": {
        "type": [
          "string",
          "null"
        ],
        "minLength": 1,
        "maxLength": 256,
        "x-max-utf8-bytes": 256
      },
      "EndpointMetadata": {
        "type": "object",
        "x-max-encoded-utf8-bytes": 1024,
        "x-max-json-depth": 4,
        "additionalProperties": {
          "$ref": "#/components/schemas/JsonDiagnosticValue"
        }
      },
      "EndpointServiceContract": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "method",
          "request_schema_id",
          "response_schema_id"
        ],
        "properties": {
          "method": {
            "type": "string",
            "enum": [
              "GET",
              "POST",
              "PUT",
              "DELETE"
            ]
          },
          "request_schema_id": {
            "$ref": "#/components/schemas/EndpointSchemaId"
          },
          "response_schema_id": {
            "$ref": "#/components/schemas/EndpointSchemaId"
          }
        }
      },
      "EndpointStreamContract": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "clock_domain",
          "stream_group_id"
        ],
        "properties": {
          "clock_domain": {
            "type": "string",
            "enum": [
              "monotonic_same_host",
              "unix_epoch_synchronized",
              "provider_defined"
            ]
          },
          "stream_group_id": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1,
            "maxLength": 128,
            "x-max-utf8-bytes": 128
          }
        }
      },
      "EndpointServiceDescriptor": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "descriptor_id",
          "kind",
          "capability",
          "contract_version",
          "protocol",
          "endpoint",
          "media_type",
          "schema_id",
          "metadata",
          "service",
          "stream"
        ],
        "properties": {
          "descriptor_id": {
            "$ref": "#/components/schemas/Identifier"
          },
          "kind": {
